name: Python package

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Static quality checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install ".[quality]"
      - name: Lint
        run: >-
          ruff check src/combstruct tests
          python-tools/generate_bfiles.py python-tools/test_generate_bfiles.py
          python-tools/write_maple_scripts.py python-tools/test_write_maple_scripts.py
      - name: Check formatting
        run: >-
          ruff format --check src/combstruct tests
          python-tools/generate_bfiles.py python-tools/test_generate_bfiles.py
          python-tools/write_maple_scripts.py python-tools/test_write_maple_scripts.py
      - name: Check package and migrated tool types
        run: mypy src/combstruct python-tools/generate_bfiles.py python-tools/write_maple_scripts.py

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test package source
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Install package for maintenance tools
        run: python -m pip install .
      - name: Test legacy Python tools
        run: python -m unittest discover -v
        working-directory: python-tools

  distribution:
    name: Build and test distribution
    runs-on: ubuntu-latest
    needs: [quality, test]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release tools
        run: python -m pip install ".[release]"
      - name: Build distributions
        run: python -m build
      - name: Check artifact contents
        run: python tests/check_artifacts.py dist/combstruct-*.whl dist/combstruct-*.tar.gz
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Check wheel contents
        run: check-wheel-contents dist/combstruct-*.whl
      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps dist/combstruct-*.whl
      - name: Test installed wheel outside checkout
        run: python "$GITHUB_WORKSPACE/tests/test_distribution.py" -v
        working-directory: ${{ runner.temp }}
      - name: Smoke-test installed command
        run: combstruct --id 56 --terms 8 --plain
        working-directory: ${{ runner.temp }}
      - name: Smoke-test module command
        run: python -m combstruct --id 56 --terms 8 --plain
        working-directory: ${{ runner.temp }}
